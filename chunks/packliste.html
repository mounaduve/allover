<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urlaubspackliste</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div x-data="packliste()" x-init="init()" x-cloak>

    <div class="max-w-xl mx-auto px-4 py-6 pb-32">
      <!-- Kopf -->
      <header class="mb-4">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold text-slate-900">🧳 Urlaubspackliste</h1>
          <button @click="load()" :class="loading && 'animate-spin'" class="text-slate-400 text-xl" title="Aktualisieren">⟳</button>
        </div>
        <p class="text-sm text-slate-500 mt-1" x-text="statusText()"></p>
        <div class="mt-3 h-2 w-full rounded-full bg-slate-200 overflow-hidden">
          <div class="h-full bg-emerald-500 transition-all duration-300" :style="`width: ${progress()}%`"></div>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">Tipp: auf die Überschrift tippen = ein-/ausklappen · mit ▲▼ die Rubrik verschieben · auf den Text tippen = umbenennen &amp; Rubrik wechseln.</p>
      </header>

      <!-- Liste nach Kategorie -->
      <template x-for="cat in categories()" :key="cat">
        <section class="mb-4">
          <h2 class="flex items-center gap-2 mb-2 px-1">
            <span @click="toggleCollapse(cat)" class="flex-1 flex items-center gap-2 cursor-pointer select-none">
              <span class="w-3 text-slate-400 text-xs" x-text="collapsed[cat] ? '▸' : '▾'"></span>
              <span class="text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="cat"></span>
              <span class="text-[11px] text-slate-400" x-text="doneCount(cat) + '/' + itemsIn(cat).length"></span>
            </span>
            <button @click="moveCat(cat, -1)" class="text-slate-400 hover:text-slate-600 text-sm px-1 leading-none" title="nach oben">▲</button>
            <button @click="moveCat(cat, 1)" class="text-slate-400 hover:text-slate-600 text-sm px-1 leading-none" title="nach unten">▼</button>
          </h2>
          <div x-show="!collapsed[cat]" class="bg-white rounded-2xl shadow-sm divide-y divide-slate-100 overflow-hidden">
            <template x-for="item in itemsIn(cat)" :key="item.id">
              <div class="flex items-center gap-2 px-3 py-3 active:bg-slate-50">
                <button x-show="editingId !== item.id" @click="toggle(item)"
                  :class="item.completed ? 'bg-emerald-500 border-emerald-500' : 'border-slate-300'"
                  class="shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors">
                  <span x-show="item.completed" class="text-white text-sm">✓</span>
                </button>

                <!-- Anzeige -->
                <span x-show="editingId !== item.id"
                  @click="startEdit(item)"
                  class="flex-1 text-[15px] cursor-text"
                  :class="item.completed && 'line-through text-slate-400'"
                  x-text="item.title"></span>
                <button x-show="editingId !== item.id" @click="remove(item)" class="shrink-0 text-slate-300 hover:text-rose-500 text-lg px-1">×</button>

                <!-- Bearbeiten: Text umschreiben + Kategorie wechseln -->
                <div x-show="editingId === item.id" class="flex-1 flex flex-col gap-1" @click.stop>
                  <input x-model="editText"
                    @keydown.enter="saveEdit(item)" @keydown.escape="cancelEdit()"
                    x-ref="edit"
                    class="w-full text-[15px] border border-emerald-400 rounded px-2 py-1 focus:outline-none">
                  <div class="flex items-center gap-2">
                    <select x-model="item.category" @change="persist(item)"
                      class="flex-1 text-sm border border-slate-300 rounded px-2 py-1 bg-white text-slate-600">
                      <template x-for="c in _categories" :key="c"><option :value="c" x-text="c"></option></template>
                    </select>
                    <button @click="saveEdit(item)" class="shrink-0 rounded bg-emerald-600 text-white text-sm px-3 py-1">Fertig</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <p x-show="items.length === 0 && !loading" class="text-center text-slate-400 py-10">
        Noch nichts drauf – füge unten den ersten Punkt hinzu. 👇
      </p>
    </div>

    <!-- Eingabeleiste unten -->
    <form @submit.prevent="submitAdd()"
      class="fixed bottom-0 inset-x-0 border-t border-slate-200 bg-white/95 backdrop-blur px-4 py-3">
      <div class="max-w-xl mx-auto flex gap-2">
        <select x-model="newCat" class="rounded-xl border border-slate-300 bg-white px-2 py-2 text-sm text-slate-600">
          <template x-for="c in _categories" :key="c"><option x-text="c" :value="c"></option></template>
        </select>
        <input x-model="newTitle" type="text" placeholder="Was noch einpacken?" enterkeyhint="done"
          class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <button type="submit" class="rounded-xl bg-emerald-600 text-white px-4 py-2 text-lg font-medium active:bg-emerald-700">+</button>
      </div>
    </form>

  </div>

  <script id="__data" type="application/json">__DATA_PLACEHOLDER__</script>
  <script>
    const CATS = ['Dokumente', 'Kleidung', 'Schuhe', 'Ranja', 'Tarek', 'Olli', 'Kulturbeutel', 'Medikamente', 'Supplements', 'Technik', 'Strand & Wasser', 'Spiele', 'Vor der Abreise', 'Sonstiges'];

    function packliste() {
      return {
        items: [],
        loading: false,
        editingId: null,
        editText: '',
        newTitle: '',
        newCat: 'Sonstiges',
        _categories: CATS,
        collapsed: {},
        catOrder: CATS.slice(),

        init() {
          try {
            this.items = JSON.parse(atob(document.getElementById('__data').textContent)) || [];
          } catch (e) { this.items = []; }
          // Ansicht-Einstellungen lokal pro Gerät (nicht mit dem anderen geteilt)
          try { this.collapsed = JSON.parse(localStorage.getItem('pl_collapsed') || '{}') || {}; } catch (e) { this.collapsed = {}; }
          try {
            const saved = JSON.parse(localStorage.getItem('pl_catOrder') || 'null');
            if (Array.isArray(saved) && saved.length) {
              this.catOrder = saved.concat(CATS.filter(c => !saved.includes(c)));
            }
          } catch (e) {}
          // Alle ~8 Sek. neu laden, damit ihr beide dieselben Häkchen seht
          setInterval(() => this.load(), 8000);
        },
        categories() {
          const present = [...new Set(this.items.map(i => i.category || 'Sonstiges'))];
          const ordered = this.catOrder.filter(c => present.includes(c));
          return ordered.concat(present.filter(c => !this.catOrder.includes(c)));
        },
        itemsIn(cat) {
          return this.items.filter(i => (i.category || 'Sonstiges') === cat);
        },
        doneCount(cat) {
          return this.itemsIn(cat).filter(i => i.completed).length;
        },
        progress() {
          if (!this.items.length) return 0;
          return Math.round(100 * this.items.filter(i => i.completed).length / this.items.length);
        },
        statusText() {
          const done = this.items.filter(i => i.completed).length;
          return `${done} von ${this.items.length} eingepackt`;
        },

        // Abschnitt ein-/ausklappen (lokal gespeichert)
        toggleCollapse(cat) {
          this.collapsed[cat] = !this.collapsed[cat];
          try { localStorage.setItem('pl_collapsed', JSON.stringify(this.collapsed)); } catch (e) {}
        },

        // Abschnitt hoch/runter verschieben (Reihenfolge lokal gespeichert)
        moveCat(cat, dir) {
          const vis = this.categories();
          const i = vis.indexOf(cat);
          const j = i + dir;
          if (i < 0 || j < 0 || j >= vis.length) return;
          vis.splice(i, 1);
          vis.splice(j, 0, cat);
          this.catOrder = vis.concat(this.catOrder.filter(c => !vis.includes(c)));
          try { localStorage.setItem('pl_catOrder', JSON.stringify(this.catOrder)); } catch (e) {}
        },

        async load() {
          if (this.editingId !== null) return; // nicht mitten im Bearbeiten neu laden
          this.loading = true;
          try {
            const res = await fetch('/webhook/packliste/items', { cache: 'no-store' });
            if (res.ok) this.items = await res.json();
          } catch (e) {} finally { this.loading = false; }
        },
        async toggle(item) {
          item.completed = !item.completed;
          try {
            await fetch('/webhook/packliste/toggle', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: item.id, completed: item.completed })
            });
          } catch (e) { item.completed = !item.completed; }
        },

        // Bearbeiten des Textes
        startEdit(item) {
          if (typeof item.id === 'string' && item.id.startsWith('tmp-')) return; // erst nach dem Speichern
          this.editingId = item.id;
          this.editText = item.title;
          this.$nextTick(() => { if (this.$refs.edit) { this.$refs.edit.focus(); this.$refs.edit.select(); } });
        },
        cancelEdit() { this.editingId = null; this.editText = ''; },
        async saveEdit(item) {
          if (this.editingId !== item.id) return;
          const t = (this.editText || '').trim();
          this.editingId = null;
          if (t && t !== item.title) {
            item.title = t;
            this.persist(item);
          }
        },

        // Änderung (Titel und/oder Kategorie) speichern
        async persist(item) {
          try {
            await fetch('/webhook/packliste/update', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: item.id, title: item.title, category: item.category })
            });
          } catch (e) {}
        },

        async submitAdd() {
          const title = (this.newTitle || '').trim();
          if (!title) return;
          const category = this.newCat || 'Sonstiges';
          this.newTitle = '';
          const optimistic = { id: 'tmp-' + Date.now(), title: title, category: category, completed: false };
          this.items.push(optimistic);
          try {
            const res = await fetch('/webhook/packliste/add', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: title, category: category })
            });
            if (res.ok) {
              const created = await res.json();
              const row = Array.isArray(created) ? created[0] : created;
              if (row && row.id) Object.assign(optimistic, row);
            }
          } catch (e) {}
        },
        async remove(item) {
          this.items = this.items.filter(i => i.id !== item.id);
          try {
            await fetch('/webhook/packliste/delete', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: item.id })
            });
          } catch (e) {}
        }
      };
    }
  </script>
</body>
</html>
